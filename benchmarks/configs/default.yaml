profiles:
  quick:
    description: Single-seed smoke benchmark covering representative product, nesting and canonical KAN tasks.
    seeds:
    - 0
    models:
    - rulekan
    - rulekan_fast
    - autosym
    - fastkan_autosym
    - gsr
    - fastkan_gsr
    - gmp
    - pysr
    - operon
    - anfis
    tasks:
    - fuzzy_ite_cross
    - same_var_exp_sin
    - pykan_exp_sin_square
    data:
      train_n: 600
      val_n: 180
      test_n: 240
      max_real_samples: 1400
    timeout_seconds: 900
    model_config:
      rulekan:
        stage_scale: 0.04
        iterative_pruning: true
        prune_refit_steps: 20
        prune_stabilize_rounds: 1
        prune_stabilize_steps: 15
        prune_candidates: 3
        plateau_rounds: 1
        plateau_steps: 35
        symbolic: true
        symbolic_gmp_steps: 25
        symbolic_tuple_steps: 10
        symbolic_commit_steps: 30
        symbolic_commit_lbfgs: 0
        symbolic_backfit_steps: 15
        symbolic_backfit_lbfgs: 0
        symbolic_final_steps: 40
        symbolic_final_lbfgs: 0
        symbolic_cleanup_seconds: 8
        symbolic_cleanup_trials: 5
        symbolic_trial_steps: 20
        symbolic_max_rules: 12
        symbolic_rank_continuation: true
        symbolic_rank_continuation_caps:
        - 3
        - 6
      vanilla_kan:
        steps: 100
        lr: 0.003
      mlp:
        width:
        - 1
        - 48
        - 48
        - 1
        steps: 180
        lr: 0.002
      autosym:
        steps: 12
        lr: 0.01
        lamb: 0.01
        prune_iters: 0
        node_th: 0.1
        edge_th: 0.0
        gate_top_k_start: 5
        top_k_gates: 5
        gating_entropy: 0.001
        gating_l1: 0.01
        edge_policy: importance_desc
        gmp_refinement_policy: importance_asc
        symbolic_trial_steps: 2
      fastkan_autosym:
        steps: 12
        lr: 0.01
        lamb: 0.01
        prune_iters: 0
        node_th: 0.1
        edge_th: 0.0
        gate_top_k_start: 5
        top_k_gates: 5
        gating_entropy: 0.001
        gating_l1: 0.01
        edge_policy: importance_desc
        gmp_refinement_policy: importance_asc
        symbolic_trial_steps: 2
      gsr:
        steps: 12
        lr: 0.01
        lamb: 0.01
        prune_iters: 0
        node_th: 0.1
        edge_th: 0.0
        gate_top_k_start: 5
        top_k_gates: 5
        gating_entropy: 0.001
        gating_l1: 0.01
        edge_policy: importance_desc
        gmp_refinement_policy: importance_asc
        symbolic_trial_steps: 2
      fastkan_gsr:
        steps: 12
        lr: 0.01
        lamb: 0.01
        prune_iters: 0
        node_th: 0.1
        edge_th: 0.0
        gate_top_k_start: 5
        top_k_gates: 5
        gating_entropy: 0.001
        gating_l1: 0.01
        edge_policy: importance_desc
        gmp_refinement_policy: importance_asc
        symbolic_trial_steps: 2
      gmp:
        steps: 12
        lr: 0.01
        lamb: 0.01
        prune_iters: 0
        node_th: 0.1
        edge_th: 0.0
        gate_top_k_start: 5
        top_k_gates: 5
        gating_entropy: 0.001
        gating_l1: 0.01
        edge_policy: importance_desc
        gmp_refinement_policy: importance_asc
        symbolic_trial_steps: 2
