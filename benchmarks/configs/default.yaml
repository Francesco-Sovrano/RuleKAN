  long_expression:
    extends: research
    description: Three-seed near-capacity symbolic-regression stress test with 39-node target expressions.
    suites:
    - expression_length_stress
    data:
      train_n: 2400
      val_n: 600
      test_n: 800
      max_real_samples: 5000
    timeout_seconds: 3600
    model_config:
      # The additive target exactly saturates this 12-rule budget.
      rulekan:
        symbolic_max_rules: 12
      rulekan_fast:
        symbolic_max_rules: 12
      # Both targets are 39 binary expression-tree nodes, immediately below these
      # external SR complexity ceilings.
      pysr:
        maxsize: 40
        niterations: 100
        populations: 8
        population_size: 50
        deterministic: true
        parallelism: serial
      operon:
        max_length: 50
        max_depth: 12
        population_size: 1000
        generations: 250
        max_evaluations: 500000
        optimizer_iterations: 5
        n_threads: 1

