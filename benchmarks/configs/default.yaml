        lr: 0.01
        lamb: 0.01
        prune_iters: 2
        node_th: 0.1
        edge_th: 0.0
        gate_top_k_start: 8
        top_k_gates: 4
        gating_entropy: 0.001
        gating_l1: 0.01
        edge_policy: importance_desc
        gmp_refinement_policy: importance_asc
        symbolic_trial_steps: 2
      gmp:
        steps: 12
        lr: 0.01
        lamb: 0.01
        prune_iters: 2
        node_th: 0.1
        edge_th: 0.0
        gate_top_k_start: 8
        top_k_gates: 4
        gating_entropy: 0.001
        gating_l1: 0.01
        edge_policy: importance_desc
        gmp_refinement_policy: importance_asc
        symbolic_trial_steps: 2
    shared_settings:
      enabled: true
      capacity: *id001
      max_product_order: 3
      grid: 12
      symbolic_library: target_core
      symbolic_rule_budget_at_least_width: true
  main:
    extends: research
    description: Alias for the compact primary research benchmark.
  research_modern:
    extends: research
    description: Research benchmark with additional contemporary symbolic-regression baselines.
    models:
    - rulekan
    - rulekan_comp
    - rulekan_adaptive
    - rulekan_fast
    - rulekan_omp_full
    - sisp
    - sisp_comp
    - power_rulekan
    - power_rulekan_comp
    - autosym
    - fastkan_autosym
    - gsr
    - fastkan_gsr
    - gmp
    - srkan
    - symbolic_kan
    - pse
    - rils_rols
    - sindy
    - parfam
    - eql
    - pysr
    - operon
    - anfis
    - multkan_deep_gsr
    # The paper's 23-method panel. Extra records in the same run directory
    # (ablations, PSE, ANFIS, or appendix-only sindy_unconstrained) are excluded
    # from task-level pairwise tests, Friedman tests, and mean-rank computation.
    main_comparison_models:
    - rulekan
    - rulekan_comp
    - rulekan_adaptive
    - rulekan_fast
    - rulekan_omp_full
    - sisp
    - sisp_comp
    - power_rulekan
    - power_rulekan_comp
    - autosym
    - fastkan_autosym
    - gsr
    - fastkan_gsr
    - gmp
    - srkan
    - symbolic_kan
    - rils_rols
    - sindy
    - parfam
    - eql
    - pysr
    - operon
    - multkan_deep_gsr
    model_config:
      symbolic_kan:
        # Authors' official Pub_Symbolic_KANs implementation, executed through
        # Exp_reaction_diffusion/symKanTraining.py::train_regression_onehot.
        # Width 12 matches the controlled neural width used by the KAN baselines;
        # all selection/hardening/LBFGS mechanics are upstream code.
        hidden_units: 12
        edges_per_unit: 3
        num_blocks: 2
        # Closest native match to the shared core10 vocabulary. The official
        # implementation has no one-step 1/x^2 primitive; with two symbolic
        # blocks it can compose inverse-square from x2 and inv.
        lib: [x, x2, inv, sqrtx, log, exp, sin, cos, tanh]
        epochs: 1200
        adam_epochs: 1000
        lr: 0.005
        weight_decay: 0.0
        use_lbfgs: true
        lbfgs_max_iter: 15
        lbfgs_steps: 40
        sel_w_start: 0.0
        sel_w_end: 0.5
        entropy_weight: 0.9
        nms_weight: 0.9
        sel_start_frac: 0.5
        tau_start: 4.0
        tau_end: 0.2
        drop_tau_to: 0.1
        middle_lbfgs_harden: false
        train_proj_b: true
        train_prim_beta: false
        train_prim_bias: true
        train_readout_bias: false
        use_unit_gates: false
        freeze_edges_for_lbfgs: true
        diagnostic_plots: false
      pse:
        operators: [Add, Mul, Sub, Div, Identity, Sin, Cos, Exp, Log, Tanh]
        n_symbol_layers: 3
        n_down_sample: 256
        extra_input_slots: 2
        use_constant: true
        top_k: 10
        time_limit: 1800
      rils_rols:
        max_fit_calls: 100000
        max_seconds: 1800
        complexity_penalty: 0.001
        error_tolerance: 1.0e-12
        max_complexity: 40
        sample_size: 1.0
        verbose: false
      udsr:
        function_set: [add, sub, mul, div, sin, cos, exp, log, poly]
        poly_degree: 3
        n_samples: 20000
        batch_size: 500
        epsilon: 0.02
        gp_population_size: 100
        gp_generations: 20
        gp_parallel_eval: false
        n_cores_batch: 1
      sindy:
        # Main-paper SINDy-12 control. The fixed core10 dictionary uses the
        # shared task-specific product order (never above 3), but the returned
        # expression may contain at most 12 active non-bias library terms.
        # Over-budget STLSQ candidates are reduced by contribution strength and
        # jointly OLS-refit before validation selection.
        primitive_library: [x, x^2, 1/x, 1/x^2, sqrt, log, exp, sin, cos, tanh]
        max_interaction_order: 3
        max_active_terms: 12
        thresholds: [1.0e-4, 1.0e-3, 1.0e-2, 5.0e-2]
        alpha: 1.0e-6
        max_iter: 100
        normalize_columns: true
      parfam:
        # Official ICLR-2025 ParFam wrapper. Polynomial/rational structure is
        # native; these configured analytic functions cover the remaining core10
        # families as closely as the public API permits.
        config_name: small
        iterate: true
        functions: [sin, cos, exp, log, sqrt, tanh]
        time_limit: 1800
      eql:
        # Budgeted PyTorch reproduction of the ICML-2018 EQL-Div protocol.
        # Native hidden units are identity/sine/cosine plus multiplication; the
        # scalar output is a regularized division. The paper's t1/t2 schedule
        # and L={2,3,4} depth selection are retained. The lambda sweep is a
        # coarse subset spanning the paper's range to respect the job budget.
        unary_library: [x, x^2, 1/x, sqrt, log, exp, sin, cos, tanh]
        units_per_type: 10
        total_layers: [2, 3, 4]
        l1_lambdas: [1.0e-6, 1.0e-5, 1.0e-4, 3.162277660168379e-4]
        steps_per_hidden_layer: 10000
        lr: 0.001
        adam_eps: 0.0001
        batch_size: 20
        phase1_frac: 0.25
        phase2_frac: 0.95
        prune_threshold: 0.001
        penalty_every: 50
        eval_division_threshold: 1.0e-4
        selection_error_weight: 0.5
        selection_sparsity_weight: 0.5
        simplify_formula: false
  sindy_sensitivity:
    extends: research_modern
    description: Appendix-only SINDy complexity sensitivity; never used for the main 23-method panel.
    models:
    - sindy
    - sindy_unconstrained
    suites:
    - fuzzy_rules
    - synthetic_core
    - power_expression_stress
    - nested_stress
    - kan_canonical
    - feynman
    model_config:
      sindy_unconstrained:
        # Same library/order/optimizer as SINDy-12, but no active-term cap.
        # This condition quantifies how much predictive accuracy can be bought
        # by allowing very long fixed-dictionary expansions.
        primitive_library: [x, x^2, 1/x, 1/x^2, sqrt, log, exp, sin, cos, tanh]
        max_interaction_order: 3
        max_active_terms: null
        thresholds: [1.0e-4, 1.0e-3, 1.0e-2, 5.0e-2]
        alpha: 1.0e-6
        max_iter: 100
        normalize_columns: true

