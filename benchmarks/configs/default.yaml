  research:
    description: Compact three-seed main symbolic-regression benchmark. It includes the validation-gated
      compositional RuleKAN and SISP variants, one representative RuleKAN OMP variant, and one deep baseline;
      redundant extractor/backbone cross-products are moved to explicit ablation profiles.
    seeds:
    - 0
    - 1
    - 2
    models:
    - rulekan
    - rulekan_comp
    - rulekan_adaptive
    - rulekan_fast
    - rulekan_omp_full
    - sisp
    - sisp_comp
    - power_rulekan
    - power_rulekan_comp
    - autosym
    - fastkan_autosym
    - gsr
    - fastkan_gsr
    - gmp
    - srkan
    - pysr
    - operon
    - anfis
    - multkan_deep_gsr
    # Only these methods enter headline pairwise tests, Friedman tests, and mean ranks.
    # ANFIS is retained as a task-specific fuzzy predictive reference, not as a
    # symbolic-regression method in the main statistical panel.
    main_comparison_models:
    - rulekan
    - rulekan_comp
    - rulekan_adaptive
    - rulekan_fast
    - rulekan_omp_full
    - sisp
    - sisp_comp
    - power_rulekan
    - power_rulekan_comp
    - autosym
    - fastkan_autosym
    - gsr
    - fastkan_gsr
    - gmp
    - srkan
    - pysr
    - operon
    - multkan_deep_gsr
    suites:
    - fuzzy_rules
    - synthetic_core
    - power_expression_stress
    - nested_stress
    - kan_canonical
    - feynman
    - real_small
    data:
      train_n: 1600
      val_n: 400
      test_n: 500
      max_real_samples: 5000
    timeout_seconds: 2400
    model_config:
      rulekan:
        stage_scale: 0.24
        iterative_pruning: true
        prune_refit_steps: 60
        prune_stabilize_rounds: 2
        prune_stabilize_steps: 30
        prune_candidates: 4
        plateau_rounds: 4
        plateau_steps: 100
        plateau_patience: 2
        numeric_lbfgs_steps: 40
        symbolic: true
        symbolic_gmp_steps: 70
        symbolic_tuple_steps: 25
        symbolic_commit_steps: 90
        symbolic_commit_lbfgs: 10
        symbolic_backfit_steps: 45
        symbolic_backfit_lbfgs: 5
        symbolic_final_steps: 160
        symbolic_final_lbfgs: 25
        symbolic_cleanup_seconds: 30
        symbolic_cleanup_trials: 12
        symbolic_trial_steps: 55
        symbolic_max_rules: 12
        # SR-inspired rescues are part of the default RuleKAN/SISP symbolic stage.
        # They are validation-gated and run once after rank continuation.
        symbolic_low_dimensional_family_rescue: true
        symbolic_low_dimensional_family_refine_topk: 18
        symbolic_low_dimensional_final_topk: 5
        # Exhaustive two-rule complementary search for small problems. Every
        # branch-family pair gets a cheap joint fit before pruning; RuleKAN
        # remains inside its learned-support contract while SISP stays free.
        symbolic_complementary_two_rule_rescue: true
        symbolic_complementary_two_rule_max_input_dim: 2
        symbolic_complementary_two_rule_coarse_global_topk: 16
        # Deep-refit the strongest coarse joint families as well as the cheap
        # local winners, preventing slow-converging correct families from dying.
        symbolic_complementary_two_rule_coarse_final_topk: 32
        symbolic_complementary_two_rule_seed_restarts: 3
        symbolic_complementary_two_rule_local_polish_steps: 28
        symbolic_complementary_two_rule_local_polish_lr: 0.01
        symbolic_complementary_two_rule_local_lbfgs_topk: 32
